<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proovy Prototyp</title>
<meta name="description" content="Proovy: kleine Gigs von Lehrstühlen, echte Nachweise im Skill-Pass statt Lebenslauf. Klickbarer Prototyp mit Demo-Daten.">
<meta property="og:title" content="Proovy">
<meta property="og:description" content="Kleine Gigs. Echte Nachweise. Der Skill-Pass statt Lebenslauf.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#10231C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Ccircle cx='36' cy='36' r='36' fill='%230E9460'/%3E%3Cpath d='M19 37 L31 50 L54 22' fill='none' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: schmale Demo-Leiste oben; darunter die Bühne mit Lenas Handy (Studi-App) links und dem Anbieter-Desktop rechts.
   Ein bewusster Look: Proovy-Farbwelt „Original" (Waldtinte, Prüfgrün, Limette, Papier), nur hell. */
:root{
  --ink:#10231C;
  --ink-2:#1B3A2E;
  --ink-muted:#B9C7BF;
  --ink-line:rgba(244,247,242,.16);
  --green:#0E9460;
  --green-text:#0B6E47;
  --lime:#C8F169;
  --paper:#F4F7F2;
  --white:#FFFFFF;
  --line:#DDE5DF;
  --line-2:#A9BDB1;
  --mist:#E6EAE2;
  --mint:#DCEFE4;
  --stage:#D9E2D5;
  --muted:#4A5A52;
  --muted-2:#3A4A42;
  --warn-bg:#FFF1CC;
  --warn-fg:#6B4E00;
  --danger:#B3261E;
  --scrim:rgba(16,35,28,.52);
  --shadow:0 22px 50px -26px rgba(16,35,28,.55);
  --display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{cursor:default}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
ol,ul{margin:0;padding:0;list-style:none}
[hidden]{display:none!important}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}

/* ---------- Logo 03 · Haken im Kreis ---------- */
.logo{display:inline-flex;align-items:baseline;font-family:var(--display);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--ink);white-space:nowrap}
.logo .mk{width:.6em;height:.6em;margin:0 .03em;flex:none}
.mk-c{fill:var(--green)}
.mk-p{fill:none;stroke:var(--white);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}

.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.star{width:16px;height:16px;flex:none;stroke:none}
.star.on{fill:var(--green)}
.star.off{fill:var(--line)}

/* ---------- App-Rahmen ---------- */
.app{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:14px;min-height:54px;padding-block:8px;padding-left:16px;padding-right:16px;background:var(--ink);color:var(--paper)}
.bar-brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.bar .logo{color:var(--paper);font-size:24px}
.bar-tag{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--ink-line);margin-left:auto}
.seg button{border:0;background:transparent;color:var(--paper);min-height:36px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.bar-reset{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--ink-line);background:transparent;color:var(--paper);font-weight:600;font-size:14px;white-space:nowrap}
.bar-reset:hover{background:var(--ink-2)}

.stage{flex:1;min-height:0;display:flex;justify-content:center;gap:24px;padding:14px 16px 16px;overflow:auto}
.side{display:flex;flex-direction:column;gap:8px;min-height:0}
.side-cap{flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding-left:6px}
.side.studi{flex:none;width:392px}
.side.anbieter{flex:1;min-width:0;max-width:1240px}
.phone{position:relative;flex:1;min-height:600px;max-height:880px;width:100%;border:10px solid var(--ink);border-radius:48px;background:var(--paper);overflow:hidden;box-shadow:var(--shadow)}
.desk{position:relative;flex:1;min-height:600px;background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);container-type:inline-size}
.stage[data-view="studi"] .side.anbieter{display:none}
.stage[data-view="anbieter"] .side.studi{display:none}

/* ---------- Studi-App ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.s-head{flex:none;display:flex;flex-direction:column;gap:10px;padding:16px 16px 8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-end{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.s-head .logo{font-size:26px}
.s-title{font-size:26px;font-weight:700;letter-spacing:-.03em}
.fitcount{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;background:var(--mint);color:var(--green-text);font-size:13px;font-weight:600;white-space:nowrap}
.fitcount .ic{width:15px;height:15px;stroke-width:2.6}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--muted-2);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.s-body{position:relative;flex:1;min-height:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.feed{scroll-snap-type:y mandatory}
.slot{height:100%;padding:6px 14px 14px;scroll-snap-align:start;scroll-snap-stop:always}
.pad{display:flex;flex-direction:column;gap:14px;padding:6px 16px 28px}

.gcard{height:100%;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:26px;background:var(--white);border:1px solid var(--line);box-shadow:0 16px 30px -24px rgba(16,35,28,.5)}
.gc-top{display:flex;align-items:center;gap:10px;min-width:0}
.gc-prov{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.gc-tags{display:flex;flex-wrap:wrap;gap:6px}
.gc-title{font-size:26px;line-height:1.08;font-weight:700;letter-spacing:-.03em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:0;border-radius:16px;overflow:hidden;background:var(--line);border:1px solid var(--line)}
.facts div{display:flex;flex-direction:column;gap:1px;padding:9px 12px;background:var(--paper);min-width:0}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mini{font-size:12px;color:var(--muted)}
.mini-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sk{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;line-height:1.25;background:var(--mist);color:var(--muted-2)}
.sk .ic{width:13px;height:13px;stroke-width:2.6}
.sk.have,.sk.conf{background:var(--mint);color:var(--green-text)}
.sk.self{background:var(--white);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
.gain{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px dashed var(--line-2);font-size:13px;color:var(--muted-2)}
.gain .ic{color:var(--green);margin-top:1px}
.gain strong{display:block;font-size:14px;color:var(--ink)}
.gc-foot{display:flex;gap:8px}

.av{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:-.01em}
.av.wi{background:var(--ink);color:var(--lime)}
.av.da{background:var(--lime);color:var(--ink)}
.av.mci{background:var(--mint);color:var(--green-text)}
.av.im{background:var(--mist);color:var(--ink)}
.av.pv{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.av.pv .mk{width:22px;height:22px}
.av.person{border-radius:50%;background:var(--ink);color:var(--lime)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap}
.pill .ic{width:13px;height:13px;stroke-width:2.6}
.pill.new{background:var(--ink);color:var(--lime);font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tag-starter{background:var(--lime);color:var(--ink)}
.tag-paid{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.fit-yes{background:var(--mint);color:var(--green-text)}
.fit-no{background:var(--mist);color:var(--muted)}
.st-open{background:var(--mist);color:var(--muted-2)}
.st-apps{background:var(--lime);color:var(--ink)}
.st-progress{background:var(--mint);color:var(--green-text)}
.st-review{background:var(--warn-bg);color:var(--warn-fg)}
.st-done{background:var(--ink);color:var(--lime)}
.st-rejected{background:var(--mist);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:15px;line-height:1.15;text-align:center;text-decoration:none}
.btn.sm{min-height:40px;padding:0 13px;font-size:14px;border-radius:12px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover:not([disabled]){background:var(--ink-2)}
.btn.primary[disabled]{opacity:.6}
.btn.ghost{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover:not([disabled]){border-color:var(--line-2)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.done{background:var(--mint);color:var(--green-text)}
.btn.grow{flex:1}
.btn[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--green-text)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;color:var(--ink)}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 6px 8px;background:var(--white);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:4px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600}
.tab .ti{width:52px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab .ic{width:22px;height:22px;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--lime)}
.tbadge{position:absolute;top:0;left:calc(50% + 10px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--lime);font-size:11px;font-weight:700}

.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px;border-radius:20px;border:1.5px dashed var(--line-2);background:var(--white)}
.empty h3{font-size:19px}
.empty p{color:var(--muted-2);font-size:14px}

.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.mg,.entry{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;background:var(--white);border:1px solid var(--line)}
.mg-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mg-tt h3{font-size:17px;line-height:1.2;letter-spacing:-.02em}
.mg-tt span{font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.step{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.step i{display:block;height:6px;border-radius:3px;background:var(--mist)}
.step.done i,.step.now i{background:var(--green)}
.step.now{color:var(--ink)}
.mg-note{font-size:14px;color:var(--muted-2);display:flex;align-items:center;gap:8px}
.submit{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--paper)}
.submit label{font-size:13px;font-weight:600}
.submit-row{display:flex;gap:8px}
.submit-row input{flex:1;min-width:0;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--white);font-size:14px}
.saved-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--white);border:1px solid var(--line)}

.pass-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:24px;background:var(--ink);color:var(--paper)}
.pass-card .deco{position:absolute;right:-26px;top:-18px;width:150px;height:150px;opacity:.12;pointer-events:none}
.pass-card .deco path{fill:none;stroke:var(--lime);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.pass-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.pass-name{font-size:28px;font-weight:700;letter-spacing:-.03em}
.pass-meta{font-size:14px;color:var(--ink-muted)}
.pass-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pass-stats div{display:flex;flex-direction:column;gap:1px;padding:9px 10px;border-radius:12px;border:1px solid var(--ink-line)}
.pass-stats b{font-family:var(--display);font-size:22px;line-height:1.1;color:var(--paper);font-variant-numeric:tabular-nums}
.pass-stats span{font-size:11px;color:var(--ink-muted)}
.entry.fresh{animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
.stars{display:inline-flex;gap:2px;align-items:center}
.quote{margin:0;padding:10px 12px;border-radius:12px;background:var(--paper);font-size:14px;color:var(--muted-2)}
.linkrow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--white);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--green-text);word-break:break-all}

/* Sheet, Feier, Toasts */
.scrim{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:var(--scrim);animation:fade .2s ease}
.sheet{width:100%;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:10px 16px 0;border-radius:26px 26px 0 0;background:var(--white);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.grab{align-self:center;width:42px;height:5px;border-radius:3px;background:var(--line)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet-t{font-size:21px;line-height:1.15}
.stack-2{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-pass{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--ink);color:var(--paper)}
.mp-lbl{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--lime)}
.mp-b{display:flex;flex-direction:column}
.mp-b b{font-family:var(--display);font-size:19px}
.mp-b span,.mp-n{font-size:13px;color:var(--ink-muted)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.flabel{font-size:13px;font-weight:600;color:var(--ink)}
.f input:not([type="range"]),.f textarea,.ai textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--white);font-size:15px;line-height:1.4}
.f textarea,.ai textarea{resize:vertical}
.f input:not([type="range"]):focus,.f textarea:focus,.ai textarea:focus,.submit-row input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(14,148,96,.2)}
.counter{align-self:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.cele{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:20px;overflow-x:hidden;overflow-y:auto;background:rgba(16,35,28,.78);animation:fade .25s ease}
.cele-card{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px 20px;border-radius:28px;background:var(--paper);text-align:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.cele-mark{width:92px;height:92px}
.cele-mark .mk-p{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .55s .3s ease forwards}
.cele-card h3{font-size:25px;line-height:1.1}
.cele-card p{font-size:14px;color:var(--muted-2)}
.cele-entry{width:100%;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--white);border:1px solid var(--line);text-align:left}
.cele-entry b{font-family:var(--display);font-size:16px;line-height:1.2}
.cele-act{width:100%;display:flex;flex-direction:column;gap:8px}
.confetti{position:absolute;top:-24px;z-index:1;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}

.toasts{position:absolute;z-index:60;left:12px;right:12px;top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toasts.desk-t{top:auto;left:auto;right:18px;bottom:18px;width:min(400px,calc(100% - 36px));align-items:flex-end}
.toasts.global{position:fixed;top:auto;left:50%;right:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:tin .25s ease;transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateY(6px)}
.tico{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--white)}
.tico .ic{width:13px;height:13px;stroke-width:3}
.toast button{flex:none;border:0;background:none;padding:6px 4px;color:var(--lime);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- Anbieter-Desktop ---------- */
.desk-in{position:absolute;inset:0;display:grid;grid-template-columns:220px minmax(0,1fr)}
.d-side{display:flex;flex-direction:column;gap:18px;min-height:0;overflow-y:auto;padding:22px 14px 14px;background:var(--paper);border-right:1px solid var(--line)}
.d-brand{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.d-brand .logo{font-size:28px}
.d-nav{display:flex;flex-direction:column;gap:2px}
.d-nav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border:0;border-radius:12px;background:none;color:var(--muted-2);font-weight:600;font-size:14px;text-align:left;white-space:nowrap}
.d-nav button:hover{background:var(--mist)}
.d-nav button[aria-current="page"]{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.d-nav .cnt{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--ink);color:var(--lime);font-size:12px;font-weight:700;text-align:center}

let tid = 0; const tActs = new Map();
function toast(side, msg, action){
  let box = side === 'global' ? $('#t-global') : (sideVisible(side) ? $('#t-' + side) : null);
  if(!box){ box = $('#t-global'); if(!action && side !== 'global') action = {label:'Zeigen', act:()=>showSide(side)}; }
  const id = ++tid; if(action) tActs.set(id, action.act);
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span class="tico">${icon('check')}</span><span>${esc(msg)}</span>${action ? `<button type="button" data-act="toast-act" data-tid="${id}">${esc(action.label)}</button>` : ''}`;
  box.appendChild(el);
  while(box.children.length > 3) box.firstElementChild.remove();
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>{ el.remove(); tActs.delete(id); }, 260); }, action ? 5600 : 3400);
}

function preserveFocus(fn){
  const a = document.activeElement; const id = a && a.id; let s = null, e = null;
  try{ s = a.selectionStart; e = a.selectionEnd; }catch(_){}
  fn();
  if(id && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')){
    const el = document.getElementById(id);
    if(el && el !== document.activeElement){ el.focus({preventScroll:true}); try{ if(s != null) el.setSelectionRange(s, e); }catch(_){} }
  }
}
function restoreScroll(){
  document.querySelectorAll('[data-scroll]').forEach(el => { const v = UI.scroll[el.dataset.scroll]; if(v != null) el.scrollTop = v; });
  if(UI.jump){
    const feed = $('.feed'); const target = feed && feed.querySelector(`[data-gid="${UI.jump}"]`);
    if(target){ feed.scrollTop = target.offsetTop; UI.scroll.feed = target.offsetTop; }
    UI.jump = null;
  }
}

function obApply(){
  const o = UI.ob;

function obNext(){
  const o = UI.ob;

    later(800, ()=>{ o.busy = false; o.step = 1; o.verified = true; renderStudent(); });
  } else if(o.step === 1){ o.step = 2; renderStudent(); }

    obApply(); o.step = 3; save(); renderStudent(); countUp();
  }

function countUp(){
  const el = $('#ob-count'); if(!el || REDUCED.matches) return;
  const target = +el.textContent; const t0 = performance.now();
  const tick = now => { const p = Math.min(1, (now - t0) / 750); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if(p < 1) requestAnimationFrame(tick); };
  el.textContent = '0'; requestAnimationFrame(tick);
}

  if(skip) obApply();

  else o.skills.push(s);

function makeDraft(txt){
  const t = txt.toLowerCase();
  const tpl = AI_TEMPLATES.find(x => x.keys.some(k => t.includes(k)));
  let d;
  if(tpl) d = JSON.parse(JSON.stringify(tpl.d));
  else {
    let core = txt.replace(/^\s*(ich\s+|wir\s+)?(brauche[n]?|suche[n]?)\s+(dringend\s+)?(jemanden|eine person|hilfe|unterstützung)\s*,?\s*(der|die|das|bei|für|um)?\s*/i, '').replace(/[.!?\s]+$/, '').trim();
    if(!core) core = txt.replace(/[.!?\s]+$/, '').trim();
    const words = core.split(/\s+/); let last = words.pop() || '';
    if(/[a-zäöüß]et$/i.test(last)) last = last.replace(/et$/i, 'en'); else if(/[^e]t$/i.test(last) && last.length > 3) last = last.replace(/t$/i, 'en');
    words.push(last);
    let title = words.join(' '); title = title.charAt(0).toUpperCase() + title.slice(1);
    if(title.length > 64) title = title.slice(0, 60).replace(/\s+\S*$/, '') + ' …';
    d = {title, desc:`${txt.trim().replace(/[.!?]*$/, '.')} Du arbeitest remote und teilst dir die Zeit bis zur Deadline selbst ein.`,
      result:'Ein abgabefertiges Ergebnis, das du als Link teilst',
      criteria:['Die Aufgabe ist vollständig erledigt','Das Vorgehen ist kurz dokumentiert','Abgabe bis zur Deadline'],
      skills:['Sorgfalt','Selbstorganisation'], hours:3, pay:45, deadlineDays:7, remote:true};
  }
  d.skillsText = d.skills.join(', '); d.payAuto = true;
  return d;
}

  const el = $('#aiInput'); const txt = ((el ? el.value : UI.aiInput) || '').trim();
  if(!txt){ UI.aiError = 'Schreib kurz, was erledigt werden soll. Ein Satz reicht.'; renderProvider(); const i = $('#aiInput'); if(i) i.focus(); return; }
  UI.aiInput = txt; UI.aiError = ''; UI.draft = null; UI.aiLoading = 0; renderProvider();
  later(650, ()=>{ UI.aiLoading = 1; renderProvider(); });
  later(1300, ()=>{ UI.aiLoading = 2; renderProvider(); });
  later(2000, ()=>{ UI.aiLoading = null; UI.draft = makeDraft(txt); renderProvider(); const f = $('#d-title'); if(f) f.focus({preventScroll:true}); });
}
function publish(){
  const d = UI.draft; if(!d) return;
  const skills = String(d.skillsText || '').split(',').map(s => s.trim()).filter(Boolean);
  const hours = Math.max(1, Math.round(+d.hours || 1));
  const g = {id:nid('g'), type:'paid', title:(String(d.title || '').trim() || 'Neuer Gig'), provider:ME, hours, pay:Math.max(0, Math.round(+d.pay || 0)),
    remote:!!d.remote, deadlineDays:Math.max(1, Math.round(+d.deadlineDays || 7)), need:skills.length ? skills : ['Sorgfalt'], gains:skills.length ? skills : ['Sorgfalt'],
    contact:'Dr. Jana Wolff', desc:d.desc, result:d.result, criteria:d.criteria.filter(c => String(c).trim()), isNew:true, createdAt:Date.now()};
  S.gigs.push(g);
  UI.draft = null; UI.aiInput = ''; UI.pTab = 'overview'; UI.filter = 'alle'; UI.scroll.feed = 0; UI.scroll.dmain = 0;
  commit();
  toast('anbieter', 'Veröffentlicht. Der Gig steht jetzt oben in Lenas Feed.');
  toast('studi', `Neuer Gig für dich: ${g.title}`, {label:'Ansehen', act:()=>{ UI.sTab = 'feed'; UI.filter = 'alle'; UI.scroll.feed = 0; showSide('studi'); renderStudent(); }});
}
function openGig(gid){ UI.sTab = 'feed'; UI.filter = 'alle'; UI.jump = gid; renderStudent(); }
function reset(){
  timers.forEach(clearTimeout); timers.clear();
  S = seed(); UI = freshUI(UI.view);
  try{ localStorage.removeItem(KEY); }catch(e){}
  closeCele(); renderSheet(); renderModal();
  ['#t-studi','#t-anbieter','#t-global'].forEach(s => { $(s).innerHTML = ''; });
  renderAll();
  toast('global', 'Demo zurückgesetzt.');
}
function resumePending(){
  S.apps.forEach(a => {
    if(a.who !== 'lena') return; const g = gigById(a.gigId); if(!g) return;
    if(g.type === 'starter'){
      if(a.status === 'applied') later(700, ()=>{ if(a.status === 'applied'){ a.status = 'accepted'; commit(); } });
      if(a.status === 'submitted') later(700, ()=>{ if(a.status === 'submitted') confirmApp(a, 5, g.gains.slice(), `Automatisch geprüft: alle ${g.criteria.length} Kriterien erfüllt.`); });
    } else if(!isMine(g)) simulateOther(a);
  });
}

const PASS_HASH = 'pass-lena-becker';
const PASS_DIR = 'pass/lena-becker/';
const ARTIFACT_URL = 'https://claude.ai/artifact/GfxiFdRN7rW679rXFbzegq';

const EXAMPLE_PASS = [

];

function copyLink(){

    if(p && p.then) p.then(() => toast('studi', 'Link zu deinem Skill-Pass kopiert.'), fallback); else fallback();
  }catch(e){ fallback(); }
}

  const U = S.user;

  const n = entries.length; const hours = entries.reduce((s,e) => s + (e.hours || 0), 0);
  const conf = []; entries.forEach(e => e.skills.forEach(s => { if(!conf.includes(s)) conf.push(s); }));
  return `<header class="pub-bar"><div class="pub-in pub-bar-in">${logo()}<span class="pub-tag">Skill-Pass</span><button type="button" class="pub-back" data-act="to-app">Zur Demo-App</button></div></header>
  <main class="pub-in pub-main">

    <section class="pub-sec" aria-labelledby="pubSk"><h2 class="sh" id="pubSk"><span>Bestätigte Skills</span><span>${conf.length}</span></h2><div class="need">${conf.map(s => `<span class="sk conf">${icon('check')}${esc(s)}</span>`).join('')}</div></section>
    <section class="pub-sec" aria-labelledby="pubE"><h2 class="sh" id="pubE"><span>Bestätigt durch Gigs</span><span>${n}</span></h2>${entries.map(entryHTML).join('')}</section>
    <section class="pub-sec" aria-labelledby="pubS"><h2 class="sh" id="pubS"><span>Selbst angegeben</span><span>nicht bestätigt</span></h2><div class="need">${U.skills.map(s => `<span class="sk self">${esc(s)}</span>`).join('')}</div><div class="linkrow">${icon('link')}<span>${esc(U.github)}</span></div></section>

    <footer class="pub-foot">${logo()}<p class="mini">Prototyp · ${esc(U.name)} ist eine fiktive Person, alle Daten sind Demo-Daten.</p></footer>
  </main>`;
}
function openGigFromPass(){
  UI.pTab = 'new'; UI.scroll.dmain = 0;
  UI.view = NARROW.matches ? 'anbieter' : 'beide';
  try{ localStorage.setItem(VKEY, UI.view); }catch(e){}
  goApp(ON_PASS_PATH ? 'new-gig' : null);
}
let resumed = false;
function route(){
  const on = ON_PASS_PATH || location.hash.replace(/^#/, '') === PASS_HASH;
  document.title = on ? S.user.name + ' · Skill-Pass · Proovy' : 'Proovy Prototyp';
  const pub = $('#pub');
  $('.app').hidden = on; pub.hidden = !on;
  if(on){ pub.innerHTML = pubHTML(); window.scrollTo(0, 0); return; }
  pub.innerHTML = '';
  renderAll();
  if(!resumed){ resumed = true; resumePending(); }
}
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if(e.key === KEY && !$('#pub').hidden){ S = load(); route(); } });

/* ================= Events ================= */
document.addEventListener('click', e => {
  if(UI.guide && !e.target.closest('#guide') && !e.target.closest('[data-act="guide"]')){ UI.guide = false; renderGuide(); }
  const t = e.target.closest('[data-act]'); if(!t) return;
  const id = t.dataset.id;
  switch(t.dataset.act){
    case 'details': openDetails(id); break;
    case 'ob-next': obNext(); break;
    case 'ob-skip': obFinish(true); break;
    case 'ob-finish': obFinish(false); break;
    case 'ob-sem': { UI.ob.sem = Math.min(12, Math.max(1, UI.ob.sem + (+t.dataset.d))); const o = $('#ob-semv'); if(o) o.textContent = `${UI.ob.sem}. Semester`; break; }
    case 'ob-skill': obSkill(t.dataset.s); break;
    case 'guide': UI.guide = !UI.guide; renderGuide(); break;
    case 'view': setView(t.dataset.v); break;
    case 'reset': reset(); break;
    case 'stab': if(UI.sheet) closeSheet(); UI.sTab = t.dataset.k; renderStudent(); break;
    case 'filter': UI.filter = t.dataset.k; UI.scroll.feed = 0; renderStudent(); break;
    case 'find-starter': UI.sTab = 'feed'; UI.filter = 'starter'; UI.scroll.feed = 0; renderStudent(); break;
    case 'apply': apply(id); break;
    case 'save': toggleSave(id); break;
    case 'open-gig': openGig(id); break;
    case 'submit': submitResult(id); break;
    case 'share': share(); break;
    case 'copy-link': copyLink(); break;
    case 'to-app': goApp(); break;
    case 'pub-gig': openGigFromPass(); break;
    case 'sheet-bg': if(e.target === t) closeSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'send-app': sendApplication(); break;
    case 'cele-go': closeCele(); UI.sTab = 'pass'; UI.scroll.pass = 0; renderStudent(); break;
    case 'cele-close': closeCele(); break;
    case 'ptab': UI.pTab = t.dataset.k; UI.scroll.dmain = 0; renderProvider(); break;
    case 'ex': { UI.aiInput = t.dataset.text; const i = $('#aiInput'); if(i){ i.value = UI.aiInput; i.focus(); } break; }
    case 'generate': generate(); break;
    case 'remote': if(UI.draft){ UI.draft.remote = t.dataset.v === '1'; renderProvider(); } break;
    case 'publish': publish(); break;
    case 'discard': UI.draft = null; renderProvider(); break;
    case 'decide': decide(id, t.dataset.ok === '1'); break;
    case 'open-confirm': openConfirm(id); break;
    case 'modal-bg': if(e.target === t) closeModal(); break;
    case 'modal-close': closeModal(); break;
    case 'star': if(UI.modal){ UI.modal.stars = +t.dataset.v; document.querySelectorAll('.starpick button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v <= UI.modal.stars))); } break;
    case 'confirm': doConfirm(); break;
    case 'toast-act': { const fn = tActs.get(+t.dataset.tid); const box = t.closest('.toast'); if(box) box.remove(); if(fn) fn(); break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'applyText'){ const c = $('#applyCount'); if(c) c.textContent = `${t.value.length}/300`; if(UI.sheet) UI.sheet.text = t.value; return; }
  if(t.id === 'ob-mail'){ UI.ob.mail = t.value; return; }
  if(t.id === 'ob-study'){ UI.ob.study = t.value; return; }
  if(t.id === 'ob-hours'){ UI.ob.hours = +t.value; const o = $('#ob-hv'); if(o) o.textContent = `${t.value} h`; const l = $('#ob-livev'); if(l) l.textContent = fitsCount(+t.value); return; }
  if(t.id === 'aiInput'){ UI.aiInput = t.value; return; }
  if(t.id === 'cfb'){ if(UI.modal) UI.modal.feedback = t.value; return; }
  if(t.id && t.id.indexOf('link-') === 0){ UI.links[t.id.slice(5)] = t.value; return; }
  const k = t.dataset && t.dataset.bind; if(!k || !UI.draft) return;
  const d = UI.draft;
  if(k.indexOf('crit') === 0){ d.criteria[+k.slice(4)] = t.value; return; }
  if(k === 'hours'){
    d.hours = t.value; const h = $('#splitHint'); if(h) h.hidden = !((+t.value || 0) > 10);
    if(d.payAuto){ d.pay = Math.round((+t.value || 0) * 15); const p = $('#d-pay'); if(p) p.value = d.pay; }
    return;
  }
  if(k === 'pay'){ d.pay = t.value; d.payAuto = false; return; }
  d[k] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if(UI.modal && t.type === 'checkbox' && t.closest('#deskModal')){
    const v = t.value; const s = UI.modal.skills;
    if(t.checked && !s.includes(v)) s.push(v); if(!t.checked) UI.modal.skills = s.filter(x => x !== v);
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(!$('#studiCele').hidden) closeCele(); else if(UI.sheet) closeSheet(); else if(UI.modal) closeModal(); else if(UI.guide){ UI.guide = false; renderGuide(); }
  } else if(e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target && e.target.id === 'aiInput'){ e.preventDefault(); generate(); }
});
document.addEventListener('scroll', e => { const el = e.target; if(el && el.dataset && el.dataset.scroll) UI.scroll[el.dataset.scroll] = el.scrollTop; }, true);
if(NARROW.addEventListener) NARROW.addEventListener('change', renderBar); else if(NARROW.addListener) NARROW.addListener(renderBar);

route();
})();
